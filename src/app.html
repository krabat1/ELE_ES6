    <div class="header">
      <h1>Játékkártya Csomagok</h1>
      <h2>7–13 éves gyerekeknek</h2>
      <h3>
        <a href="https://www.egylepesegyutt.hu/" target="_blank"
          >Egy Lépés Együtt ~ Tanulás Támogató Tér</a
        >
      </h3>
    </div>

    <form id="login" style="display: block" class="view">
      <div class="login-inner">
        <h2>Belépés</h2>
        <div class="login-fields">
          <input type="email" id="email" placeholder="Email" />
          <div class="login-password">
            <input type="password" id="password" placeholder="Jelszó" />
            <input type="checkbox" id="spw" data-action="showPass" class="sr-only"/>
            
            <label for="spw" title="Jelszó megjelenítése/elrejtése"></label>
          </div>
        </div>
        <button type="submit" class="blue" data-action="login">Belépés</button>
        <p id="loginError"></p>
      </div>
    </form>

    <div id="home" class="view">
      <div id="topActions">
        <button class="orange" data-action="openTake5">Napi Minikihívás</button>
        <button class="blue" data-action="openFavs">Kedvencek listája</button>
        <button class="red" data-action="logout">Kijelentkezés</button>
      </div>

      <h2>Paklik</h2>
      <div class="loader"></div>
      <div class="grid" id="deckGrid"></div>
    </div>

    <div id="switchView" class="view" style="display: none; padding: 1rem">
      <div id="topActions" class="left">
        <button class="red" data-action="backHome">Vissza</button>
        <button class="green" data-action="fakeRandom">Húzok egy kártyát</button>
      </div>
      <div id="description"></div>
      <h2>Paklik</h2>
      <div class="loader"></div>
      <div class="grid" id="switchCards"></div>
    </div>

    <dialog id="dialogView" class="">
      <form method="dialog">
        <button><span>&times;</span></button>
      </form>
      <div class="separator"></div>
      <div class="dialogText">Greetings, one and all!</div>
      <div class="separator"></div>
      <div class="dialogButtons"></div>
    </dialog>
